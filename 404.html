<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>404 | Antonio Pelusi</title>

        <meta name="description" content="Page not found - Antonio Pelusi" />
        <meta name="author" content="Antonio Pelusi" />

        <link
            rel="icon"
            type="image/png"
            href="/assets/icons/favicon/favicon-96x96.png"
            sizes="96x96"
        />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/assets/icons/favicon/favicon.svg"
        />
        <link rel="shortcut icon" href="/assets/icons/favicon/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/assets/icons/favicon/apple-touch-icon.png"
        />
        <link rel="manifest" href="/assets/icons/favicon/site.webmanifest" />
        <meta
            name="apple-mobile-web-app-title"
            content="antoniopelusi.github.io"
        />

        <link
            rel="preload"
            href="/assets/fonts/Roboto-Regular.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/assets/fonts/Roboto-Bold.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />

        <style>
            @font-face {
                font-family: "Roboto Local";
                src: url("/assets/fonts/Roboto-Regular.woff2") format("woff2");
                font-weight: 400;
                font-style: normal;
                font-display: block;
            }

            @font-face {
                font-family: "Roboto Local";
                src: url("/assets/fonts/Roboto-Bold.woff2") format("woff2");
                font-weight: 700;
                font-style: normal;
                font-display: block;
            }

            :root {
                --dark: #111828;
                --light: #e2e8f0;
                --muted: #a2afc1;
                --bubble: #739bd0;

                --font-family: "Roboto Local", sans-serif;
                --weight-regular: 400;
                --weight-bold: 700;

                --duration: 0.2s;

                --root-size: clamp(18px, 0.5vw + 14px, 19px);

                --size-h1: 2.25rem;
                --size-body: 0.92rem;
                --size-sm: 0.78rem;

                --space-s: 0.9rem;
                --space: 1.8rem;
                --space-l: 2.7rem;

                --line-height-h1: 1.3;
                --line-height-body: 1.6;

                --color-text: var(--muted);
                --color-heading: var(--light);
                --color-link: var(--light);
                --selection-bg: var(--muted);
                --selection-fg: var(--dark);

                --z-bubble: -1;
                --bubble-alpha: 8%;
                --bubble-blur: 75px;
                --bubble-radius: 50% 40% 60% 30%;
                --bubble-size-a: clamp(200px, 25vw, 400px);
                --bubble-size-b: clamp(150px, 20vw, 300px);
                --bubble-inset-x: clamp(1rem, 5vw, 3rem);
                --bubble-inset-y: clamp(1rem, 5vh, 3rem);
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            * {
                margin: 0;
                padding: 0;
                font-family: var(--font-family);
                font-feature-settings:
                    "liga" 0,
                    "clig" 0,
                    "kern" 0;
                transition: text-decoration-color var(--duration);
            }

            ::selection {
                background-color: var(--selection-bg);
                color: var(--selection-fg);
            }

            html {
                height: 100%;
                background-color: var(--dark);
                font-size: var(--root-size);
                -webkit-text-size-adjust: 100%;
                text-size-adjust: 100%;
            }

            body,
            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            body {
                gap: var(--space);
                min-height: 100%;
                padding: var(--space-l);
                color: var(--color-text);
                font-size: var(--size-body);
                font-weight: var(--weight-regular);
                line-height: var(--line-height-body);
            }

            main {
                gap: var(--space-s);
                max-width: 100%;
                text-align: center;
            }

            h1 {
                color: var(--color-heading);
                font-size: var(--size-h1);
                font-weight: var(--weight-regular);
                line-height: var(--line-height-h1);
            }

            h1 span:first-child {
                font-weight: var(--weight-bold);
            }

            h1 span:last-child {
                color: var(--color-text);
            }

            p {
                max-width: 100%;
                font-size: var(--size-sm);
                overflow-wrap: anywhere;
            }

            p:empty {
                display: none;
            }

            a {
                color: var(--color-link);
                font-weight: var(--weight-regular);
                text-decoration: underline;
                text-decoration-color: var(--muted);
            }

            @media (hover: hover) {
                a:hover {
                    text-decoration-color: var(--light);
                }
            }

            body::before,
            body::after {
                content: "";
                position: fixed;
                z-index: var(--z-bubble);
                border-radius: var(--bubble-radius);
                background-color: color-mix(in srgb, var(--bubble) var(--bubble-alpha), transparent);
                filter: blur(var(--bubble-blur));
                pointer-events: none;
            }

            body::before {
                top: var(--bubble-inset-y);
                left: var(--bubble-inset-x);
                width: var(--bubble-size-a);
                height: var(--bubble-size-a);
            }

            body::after {
                right: var(--bubble-inset-x);
                bottom: var(--bubble-inset-y);
                width: var(--bubble-size-b);
                height: var(--bubble-size-b);
            }

            @media print {
                body::before,
                body::after {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1><span>404</span> <span>| Not Found</span></h1>
            <p></p>
            <a href="/">Go back</a>
        </main>
        <script>
            const missing = new URLSearchParams(location.search).get("from") || location.href;
            document.querySelector("main p").textContent = missing;
            document.querySelector("main a").href =
                new URL(missing, location.origin).pathname.replace(/[^/]*\/?$/, "") || "/";
        </script>
    </body>
</html>
